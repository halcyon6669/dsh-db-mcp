# Publish to npmjs.org with OIDC trusted publishing.
#
# No NPM_TOKEN secret is involved: npm 11.5.1+ (Node 22.14+/24) trades the
# workflow's `id-token` for a short-lived publish credential, and npmjs.org
# checks it against the trusted publisher configured for this package:
#
#   Provider:   GitHub Actions
#   Owner:      halcyon6669
#   Repository: dsh-db-mcp
#   Workflow:   publish.yml        (basename only, not the full path)
#   Environment: (leave blank)
#
# Release flow: bump the version, commit, push a `v<version>` tag.

name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up Python
        # dev/shims.test.mjs starts the real Python MCP server and asserts that
        # the eight `mcp__db__*` tools get published, so the runner needs the
        # interpreter *and* the server's dependencies.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Python server dependencies
        run: python -m pip install --disable-pip-version-check -r server/requirements.txt

      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$expected" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${version}"
            exit 1
          fi
          echo "publishing ${version}"

      - name: Run the portable test suites
        run: npm run test:ci

      - name: Show what will be published
        run: npm pack --dry-run

      - name: Publish
        # The provenance flag attaches an attestation tying the tarball to this
        # workflow run and commit; `npm view dsh-db-mcp@<version> --json` then
        # exposes it under dist.attestations.
        run: npm publish --provenance --access public

      - name: Verify the release landed
        # npm answers `+ dsh-db-mcp@<version>` as soon as it accepts the upload,
        # but the read CDN can lag by a few minutes ("Your package is being
        # processed and may take a few minutes to become available"), so this
        # polls generously instead of failing a successful publish.
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 20); do
            live="$(npm view "dsh-db-mcp@${version}" version --prefer-online 2>/dev/null || true)"
            if [ "$live" = "$version" ]; then
              echo "dsh-db-mcp@${version} is live"
              exit 0
            fi
            echo "attempt ${attempt}/20: registry says '${live:-<missing>}', retrying in 15s"
            sleep 15
          done
          echo "::warning::the publish succeeded but the registry never reported ${version} within 5 minutes"
          exit 1
